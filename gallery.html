<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Swimming Club. Club for swimmers in Liverpool, London. Indoor and outdoor swimming. Liverpool docks and London Lewisham Park">
    <meta name="keywords" content="swimming, swim, swimming club, swimmers, Liverpool, London, sport, exercise">
    <title>The Swimming Club</title>

    <link rel="apple-touch-icon" sizes="180x180" href="assets/css/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/css/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/css/images/favicon-16x16.png">
    <link rel="icon" href="assets/css/images/favicon.ico">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Gallery page layout: consistent header, navigation, and content area -->
    <header>
        <!-- Brand title and navigation links shared across the site -->
        <a href="index.html">
            <h1 id="logo">The Swimming Club</h1>
        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">
            <i class="fa-solid fa-bars"></i>
        </label>
        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Photo gallery section for showcasing club activities and swimmers -->
        <section id="gallery">
            <h2>The Swimming Club Gallery</h2>
            <div id="photos">
                <img src="assets/css/images/gentrit-sylejmani-JjUyjE-oEbM-unsplash.jpg" alt="Man swimming in the pool">
                <img src="assets/css/images/istockphoto-1459549181-1024x1024.jpg" alt="Group swimming">
                <img src="assets/css/images/istockphoto-2165876695-1024x1024.jpg" alt="Seniors swimming in the pool">
                <img src="assets/css/images/istockphoto-2165877210-1024x1024.jpg" alt="Instructor tutoring a swimmer">
                <img src="assets/css/images/jeremy-bishop-LkaGRQiic78-unsplash.jpg" alt="A woman swimming in the deep">
                <img src="assets/css/images/maksym-tymchyk-bGOBoZorNoQ-unsplash.jpg" alt="A woman training for competition">
                <img src="assets/css/images/marcus-ng-ZbbhkQ0M2AM-unsplash.jpg" alt="A swimmer swimming the full length swimming pool">
                <img src="assets/css/images/raj-rana-ttzU0sZmkpA-unsplash.jpg" alt="A child training in the pool">
                <img src="assets/css/images/serena-repice-lentini-hawN8XnaJuY-unsplash.jpg" alt="A swimmer, swimming the full length">
                <img src="assets/css/images/serena-repice-lentini-q4tScOAuIm8-unsplash.jpg" alt="Swimming the full length">
                <img src="assets/css/images/serena-repice-lentini-TVOAbbLL050-unsplash.jpg" alt="A swimming contest">
                <img src="assets/css/images/todd-quackenbush-E9PJO_vL3E8-unsplash.jpg" alt="Swimming in a river">
                
            </div>
        </section>
    </main>

    <footer>
        <!-- Footer content with social links and map -->
        <ul id="social-networks">
            <li>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Visit our Facebook page (opens in a new tab)">
                    <i class="fa-brands fa-facebook"></i>
                </a>
            </li>
            <li>
                <a href="https://www.twitter.com/" target="_blank" rel="noopener" aria-label="Visit our Twitter page (opens in a new tab)">
                    <i class="fa-brands fa-twitter"></i>
                </a>
            </li>
            <li>
                <a href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="Visit our YouTube page (opens in a new tab)">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </li>
            <li>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Visit our Instagram page (opens in a new tab)">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </li>
        </ul>

        <div class="footer-map">
            <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-0.363%2C53.738%2C-0.323%2C53.758&layer=mapnik&marker=53.748%2C-0.343" title="Map showing Woburn Avenue, Hull, East Yorkshire" loading="lazy"></iframe>
        </div>
    </footer>

    <script src="https://kit.fontawesome.com/3b20d96fa9.js" crossorigin="anonymous"></script>

</html>
