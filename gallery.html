<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Project-specific SEO copy updated for the Hull and Doncaster swimming club brief. -->

    <!-- Title -->

    <!-- Favicon -->

    <link rel="icon" type="image/png" sizes="16x16" href="assets/css/images/favicon-16x16.png">

<body>

        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">

        <nav>
            <ul id="menu">

            <h2>The Swimming Club Gallery</h2>

                <img src="assets/css/images/jeremy-bishop-LkaGRQiic78-unsplash.jpg" alt="A woman swimming in open water">
                <img src="assets/css/images/maksym-tymchyk-bGOBoZorNoQ-unsplash.jpg" alt="A woman training for competition">
                <img src="assets/css/images/marcus-ng-ZbbhkQ0M2AM-unsplash.jpg" alt="A swimmer swimming the full length of the pool">
                <img src="assets/css/images/raj-rana-ttzU0sZmkpA-unsplash.jpg" alt="A child training in the pool">
                <img src="assets/css/images/serena-repice-lentini-hawN8XnaJuY-unsplash.jpg" alt="A swimmer swimming the full length">
                <img src="assets/css/images/serena-repice-lentini-q4tScOAuIm8-unsplash.jpg" alt="Swimming the full length">
                <img src="assets/css/images/serena-repice-lentini-TVOAbbLL050-unsplash.jpg" alt="A swimming contest">
                <img src="assets/css/images/todd-quackenbush-E9PJO_vL3E8-unsplash.jpg" alt="Swimming in a river">
                <img src="assets/css/images/marcus-ng-ZbbhkQ0M2AM-unsplash (1).jpg" alt="Swimmer in a lane during a training session">
                <img src="assets/css/images/istockphoto-1429492803-1024x1024.jpg" alt="Swimmers training together in a pool">
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-details">
                <h3>The Swimming Club</h3>
                <p>Friendly training, swim meet-ups, and community sessions in Hull and Doncaster.</p>
            </div>

            <div class="footer-links">
                <h3>Explore</h3>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="signup.html">Sign Up</a></li>
                </ul>
            </div>

            <!-- External resource: OpenStreetMap embed; the title is project-specific Hull location copy. -->
            <div class="footer-map">
                <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-0.363%2C53.738%2C-0.323%2C53.758&layer=mapnik&marker=53.748%2C-0.343" title="Map showing the Hull Dock area, Hull, East Yorkshire" loading="lazy"></iframe>
            </div>
        </div>

        <!-- Search links help visitors find the club until official profiles are available. -->
        <ul id="social-networks">
