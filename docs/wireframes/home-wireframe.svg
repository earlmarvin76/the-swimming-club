<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Home page wireframe</title>
  <desc id="desc">Low fidelity wireframe showing the Swimming Club home page structure.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #263238; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 16px; }
    .line { stroke: #263238; stroke-width: 3; fill: none; }
    .block { stroke: #263238; stroke-width: 3; fill: #eef2f3; }
    .image { stroke: #263238; stroke-width: 3; fill: #cbd5d8; }
    .accent { stroke: #263238; stroke-width: 3; fill: #f5b3a7; }
  </style>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="40" y="48" class="label">HOME PAGE WIREFRAME</text>
  <rect x="40" y="75" width="1120" height="70" class="block"/>
  <text x="65" y="118" class="label">LOGO</text>
  <text x="830" y="118" class="small">HOME</text><text x="930" y="118" class="small">GALLERY</text><text x="1050" y="118" class="small">SIGN UP</text>
  <rect x="40" y="170" width="1120" height="250" class="image"/>
  <path d="M40 380 L260 240 L440 350 L650 205 L1160 390" class="line"/>
  <text x="425" y="280" class="label">HERO IMAGE</text>
  <rect x="355" y="315" width="490" height="58" class="accent"/>
  <text x="475" y="351" class="label">CLUB NAME + LOCATIONS</text>
  <text x="40" y="465" class="label">WHY SWIM WITH US?</text>
  <rect x="40" y="490" width="250" height="145" class="block"/><rect x="315" y="490" width="250" height="145" class="block"/><rect x="590" y="490" width="250" height="145" class="block"/><rect x="865" y="490" width="295" height="145" class="image"/>
  <text x="102" y="535" class="small">BENEFIT</text><text x="377" y="535" class="small">BENEFIT</text><text x="652" y="535" class="small">BENEFIT</text><text x="965" y="570" class="small">SUPPORTING IMAGE</text>
  <rect x="40" y="680" width="1120" height="120" class="accent"/>
  <text x="530" y="725" class="label">MEETUP TIMES</text><text x="360" y="765" class="small">MONDAY  |  WEDNESDAY  |  FRIDAY  |  SATURDAY  |  SUNDAY</text>
  <rect x="40" y="830" width="1120" height="35" class="block"/><text x="515" y="855" class="small">FOOTER / LINKS / MAP</text>
</svg>