<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta tags -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Swimming Club. Friendly swim sessions, coaching, and community events in Hull and Doncaster.">
    <meta name="keywords" content="swimming club, swim, Hull, Doncaster, fitness, training, coaching">
    <!-- Title -->
    <title>The Swimming Club</title>

    <!-- Favicon -->
    <link rel="icon" sizes="192x192" href="assets/css/images/android-chrome-192x192.png">
    <link rel="icon" sizes="512x512" href="assets/css/images/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="180x180" href="assets/css/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/css/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/css/images/favicon-16x16.png">
    <link rel="icon" href="assets/css/images/favicon.ico">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Sign-up page layout using the same header and navigation as the rest of the site -->
    <header>
        <!-- Club branding and navigation links for easy page switching -->
        <a href="index.html">
            <h1 id="logo">The Swimming Club</h1>
        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">
            <i class="fa-solid fa-bars"></i>
        </label>
        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="signup.html" class="active">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Membership sign-up section with a form for new club members -->
        <section id="signup">
            <form id="signup-form" method="post" action="https://formdump.codeinstitute.net">
                <h2><i class="fa-solid fa-water"></i> Let's Get You Signed Up!</h2>

                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first_name" class="text-input" required>

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last_name" class="text-input" required>

                <label for="email-address">Email Address:</label>
                <input type="email" id="email-address" name="email-address" class="text-input" required>

                <div class="radio-buttons">
                    <div>
                        <label for="pool">Pool</label>
                        <input type="radio" name="swimming_preference" id="pool" value="pool" required checked>
                    </div>
                    <div>
                        <label for="open-water">Open Water</label>
                        <input type="radio" name="swimming_preference" id="open-water" value="open-water" required>
                    </div>
                    <div>
                        <label for="both">Both</label>
                        <input type="radio" name="swimming_preference" id="both" value="both" required>
                    </div>
                </div>

                <button type="submit" class="join-button">Let's Swim!</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-details">
                <h3>The Swimming Club</h3>
                <p>Friendly training, swim meet-ups, and community sessions in Hull and Doncaster.</p>
            </div>

            <div class="footer-links">
                <h3>Explore</h3>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="signup.html">Sign Up</a></li>
                </ul>
            </div>

            <div class="footer-map">
                <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-0.363%2C53.738%2C-0.323%2C53.758&layer=mapnik&marker=53.748%2C-0.343" title="Map showing Woburn Avenue, Hull, East Yorkshire" loading="lazy"></iframe>
            </div>
        </div>

        <ul id="social-networks">
            <li>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Visit our Facebook page (opens in a new tab)">
                    <i class="fa-brands fa-facebook"></i>
                </a>
            </li>
            <li>
                <a href="https://www.twitter.com/" target="_blank" rel="noopener" aria-label="Visit our Twitter page (opens in a new tab)">
                    <i class="fa-brands fa-twitter"></i>
                </a>
            </li>
            <li>
                <a href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="Visit our YouTube page (opens in a new tab)">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </li>
            <li>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Visit our Instagram page (opens in a new tab)">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </li>
        </ul>
    </footer>

    <script src="assets/js/script.js"></script>
    <script src="https://kit.fontawesome.com/3b20d96fa9.js" crossorigin="anonymous"></script>
</body>

</html>
