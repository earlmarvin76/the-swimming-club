<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags for search engines -->
    <meta name="description"
        content="The Swimming Club. Club for swimmers in Liverpool, London. Indoor and outdoor swimming. Liverpool docks and London Lewisham Park">
    <meta name="keywords" content="swimming, swim, swimming club, swimmers, Liverpool, London, sport, exercise">
    <!-- Title -->
    <title>The Swimming Club</title>
</head>
    <body>
      <!-- Header -->
      <header>
        <a href="index.html">
            <h1 id="logo">The Swimming Club</h1>
        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">
            <i class="fa-solid fa-bars"></i>
        </label>
        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
      </header>
    <!-- Main content of the page -->
    <main>
        <main>
        <section id="signup">
            <form id="signup-form" method="post" action="https://formdump.codeinstitute.net">
                <h2><i class="fa-solid fa-heartbeat"></i>Let`s Get You Signed up!</h2>
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first_name" class="text-input" required>
                <br>
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last_name" class="text-input" required>
                <br>
                <label for="email-address">Email Address:</label>
                <input type="email" id="email-address" name="email-address" class="text-input" required>
                <br>
                <div class="radio-buttons">
                    <div>
                        <label for="road">Road</label>
                        <input type="radio" name="running_preference" id="road" value="road" required checked>
                    </div>
                    <div>
                        <label for="trail">Trail</label>
                        <input type="radio" name="running_preference" id="trail" value="trail" required>
                    </div>
                    <div>
                        <label for="both">Both</label>
                        <input type="radio" name="running_preference" id="both" value="both" required>
                    </div>
                </div>
                <button type="submit" class="join-button">Let`s Run!</button>
            </form>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
         <ul id="social-networks">
            <li>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Facebook page (opens in a new tab)">
                    <i class="fa-brands fa-facebook"></i></a>
            </li>
            <li>
                <a href="https://www.twitter.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Twitter page (opens in a new tab)">
                    <i class="fa-brands fa-twitter"></i></a>
            </li>
            <li>
                <a href="https://www.youtube.com/" target="_blank" rel="noopener"
                    aria-label="Visit our YouTube page (opens in a new tab)">
                    <i class="fa-brands fa-youtube"></i></a>
            </li>
            <li>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Instagram page (opens in a new tab)">
                    <i class="fa-brands fa-instagram"></i></a>
            </li>
        </ul>
        <!-- OpenStreetMap embed shows the agency's Hull location without an API key. -->
            <div class="footer-map">
                <iframe
                    src="https://www.openstreetmap.org/export/embed.html?bbox=-0.363%2C53.738%2C-0.323%2C53.758&layer=mapnik&marker=53.748%2C-0.343"
                    title="Map showing Woburn Avenue, Hull, East Yorkshire"
                    loading="lazy"></iframe>
            </div>

    </footer>
